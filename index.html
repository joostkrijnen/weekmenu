    <title>Shelfie</title>
    <script>
      try {
        const t = localStorage.getItem("barabas-theme")
        const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
    <style>
      /* Native app only: the launch screen again, drawn by the page, so the native splash can hand over without a visible
         change: white with the orange wordmark. On the very first open the elf plays its intro on the shelf
         (src/boot.ts), then the logo moves into the header. Must match ios/App/App/Base.lproj/LaunchScreen.storyboard. */
      #boot { display: none; }
      .native-boot #boot { display: block; position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; }
      #boot .boot-bg { position: absolute; inset: 0; background: #ffffff; }
      #boot svg { position: absolute; left: 25.57vw; top: 26.82%; width: 48.85vw; transform: translateY(-50%); color: #e2580c; }
      #boot .boot-elf { position: absolute; left: 21.5vw; top: calc(62.9% - 47.07vw); width: 57vw; aspect-ratio: 264 / 226;
        background: url(./intro/elf.webp) 0 0 / 600% 400% no-repeat; }
    </style>
    <script>
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
          document.documentElement.classList.add("native-boot")
          // Until onboarding is done the intro plays: start fetching the elf's frames right away.
          if (!localStorage.getItem("shelfie:onboarded")) new Image().src = "./intro/elf.webp"
          // Safety net: never keep the splash longer than 10 seconds, whatever happens while loading.
          setTimeout(() => {
            const b = document.getElementById("boot")
            if (b) { b.remove(); try { window.Capacitor.Plugins.SplashScreen.hide() } catch {} }
          }, 10000)
        }
      } catch {}
    </script>
